        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <form id="addForm" class="modal-form">
        <div class="form-row">
          <label>设施名称 <span class="req">*</span><input name="name" required placeholder="如：刷石机"></label>
          <label>图标 (emoji) <input name="icon" placeholder="⚙️"></label>
        </div>
        <div class="form-row">
          <label>所属世界
            <select name="world">
              <option>主世界</option>
              <option>地狱</option>
              <option>末地</option>
            </select>
          </label>
          <label>分类
            <select name="category">
              <option value="机器">机器</option>
              <option value="公共设施">公共设施</option>
            </select>
          </label>
        </div>
        <div class="form-row">
          <label>负责人（QQ）<input name="owner" placeholder="玩家名，点击可复制 QQ"></label>
          <label>地图 X 坐标 <input name="x" type="number" min="0" max="800" placeholder="0-800"></label>
        </div>
        <div class="form-row">
          <label>地图 Y 坐标 <input name="y" type="number" min="0" max="470" placeholder="0-470"></label>
          <label>游戏内坐标 <input name="coords" placeholder="X: -856, Y: 69, Z: 478"></label>
        </div>
        <label>产出（逗号分隔）
          <input name="output" placeholder="圆石, 石头, 平滑石头">
        </label>
        <label>依赖站点 <input name="depend" placeholder="如：追风港"></label>
        <label>提示 / 使用说明
          <textarea name="tips" rows="3" placeholder="开机：务必先拉下拉杆，再按一下石质按钮……"></textarea>
        </label>
        <label>接驳方式
          <textarea name="transport" rows="2" placeholder="如：地铁1号线/冰道，到达XXX站后出站，步行至目的地"></textarea>
        </label>
        <div class="form-row form-actions">
          <button type="button" class="btn btn-ghost" id="formCancel">取消</button>
          <button type="submit" class="btn btn-primary">保存设施</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 轻提示 -->
  <div class="toast" id="toast"></div>

  <script src="js/facilities.js"></script>
</body>
</html>
